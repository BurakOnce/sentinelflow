[project]
name = "sentinelflow"
version = "0.1.0"
description = "Streaming security log analytics and threat detection platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect>=0.8",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.optional-dependencies]
simulator = [
    "confluent-kafka>=2.10",
    "faker>=37.0",
]
streaming = [
    "confluent-kafka>=2.10",
    "pyspark>=4.0,<5",
    "pandas>=2.2,<3",
    "pyarrow>=18.0",
]
orchestration = [
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "dagster-postgres>=0.27",
    "dagster-dbt>=0.27",
    "dbt-clickhouse>=1.9",
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
]

[project.scripts]
sentinelflow-sim = "simulator.cli:app"
sentinelflow-enrich = "enrichment.cli:app"
sentinelflow-notify = "notifier.service:main"
sentinelflow-rules = "detections.catalog:app"
sentinelflow-demo = "orchestration.demo:app"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator", "streaming", "detections", "enrichment", "orchestration", "storage", "notifier"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "T20"]
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"simulator/**" = ["S105", "S311"]
"enrichment/threat_intel.py" = ["S310"]
"enrichment/geoip_loader.py" = ["S310"]
"notifier/service.py" = ["S310"]
"orchestration/demo.py" = ["S603", "S607"]
"streaming/runtime.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
    "simulator",
    "streaming",
    "detections",
    "enrichment",
    "orchestration",
    "storage",
    "notifier",
    "tests",
]

[[tool.mypy.overrides]]
module = ["pyspark.*", "confluent_kafka.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the docker compose stack",
    "spark: requires a local spark session",
]
