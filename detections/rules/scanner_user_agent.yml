title: Known Scanner User Agent
id: ea8124f3-38ec-4651-8ea2-53c1511dfa6c
name: scanner_user_agent
status: stable
description: A request carried the user agent of a well known vulnerability or content scanner.
references:
  - https://attack.mitre.org/techniques/T1595/002/
author: SentinelFlow
date: 2026-09-30
tags:
  - attack.reconnaissance
  - attack.t1595.002
logsource:
  product: sentinelflow
  category: web
  service: nginx
detection:
  selection:
    user_agent|contains:
      - sqlmap
      - nikto
      - nmap
      - masscan
      - zgrab
      - nuclei
      - dirbuster
      - gobuster
      - wpscan
      - acunetix
      - wfuzz
  condition: selection
falsepositives:
  - Authorized security assessments
level: medium
