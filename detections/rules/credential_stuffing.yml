title: Portal Login Attempt
id: 97874024-4506-40bc-8208-be9b5d263b5c
name: portal_login_attempt
status: stable
description: Any login attempt against the portal authentication service.
references:
  - https://attack.mitre.org/techniques/T1110/004/
author: SentinelFlow
date: 2026-09-30
tags:
  - attack.credential-access
logsource:
  product: sentinelflow
  category: authentication
  service: app
detection:
  selection:
    event_action: app_login
  condition: selection
falsepositives:
  - Normal user logins
level: informational
---
title: Credential Stuffing
id: 4e50c174-e031-414e-9d98-3c33f2105367
name: credential_stuffing
status: experimental
description: >-
  Portal logins from twenty or more addresses for thirty or more accounts within ten minutes
  where at least eighty percent of the attempts failed.
references:
  - https://attack.mitre.org/techniques/T1110/004/
  - https://owasp.org/www-community/attacks/Credential_stuffing
author: SentinelFlow
date: 2026-09-30
tags:
  - attack.credential-access
  - attack.t1110.004
correlation:
  type: value_count
  rules:
    - portal_login_attempt
  group-by:
    - host_name
  timespan: 10m
  condition:
    field: source_ip
    gte: 20
falsepositives:
  - Outage recovery where many users retry at once
level: high
sentinelflow:
  having:
    - aggregate: value_count
      field: user_name
      gte: 30
    - aggregate: ratio
      field: event_outcome
      equals: failure
      gte: 0.8
