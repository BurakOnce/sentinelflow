title: Password Spraying
id: 92ac5167-1e28-40bd-897e-6d079233274e
name: password_spraying
status: stable
description: >-
  One source address tried five or more different accounts within ten minutes, at least eighty
  percent of its password attempts failed and it kept a consistent client. Rotating clients
  across many addresses is covered by the credential stuffing rule.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: SentinelFlow
date: 2026-09-30
modified: 2026-09-30
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - interactive_login_attempt
  group-by:
    - source_ip
  timespan: 10m
  condition:
    field: user_name
    gte: 5
falsepositives:
  - Shared egress addresses such as office NAT gateways during a mass password reset
level: high
sentinelflow:
  having:
    - aggregate: ratio
      field: event_outcome
      equals: failure
      gte: 0.8
    - aggregate: value_count
      field: user_agent
      lte: 2
