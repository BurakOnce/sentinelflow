title: Interactive Login Attempt
id: 8830e7bd-c619-44c2-8ce6-29715451165c
name: interactive_login_attempt
status: stable
description: A password based login to the portal or to sshd, successful or not.
references:
  - https://attack.mitre.org/techniques/T1110/
author: SentinelFlow
date: 2026-09-30
modified: 2026-09-30
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: sentinelflow
  category: authentication
detection:
  selection:
    event_action:
      - app_login
      - ssh_login
  condition: selection
falsepositives:
  - Normal user logins
level: informational
