rule: password_spraying
cases:
  - name: one address fails against five accounts with one client
    expect: alert
    count: 1
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"warn","service":"portal-auth","event":"login","request_id":"s{n}","user":"user{n}","ip":"95.24.1.10","result":"failure","reason":"invalid_password","mfa":"push","user_agent":"python-requests/2.32.3"}}'
        repeat: 5
        every: 20
  - name: four accounts stay below the threshold
    expect: no_alert
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"warn","service":"portal-auth","event":"login","request_id":"s{n}","user":"user{n}","ip":"95.24.1.10","result":"failure","reason":"invalid_password","mfa":"push","user_agent":"python-requests/2.32.3"}}'
        repeat: 4
        every: 20
  - name: busy office gateway where most logins succeed
    expect: no_alert
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"info","service":"portal-auth","event":"login","request_id":"o{n}","user":"staff{n}","ip":"78.160.200.1","result":"success","reason":null,"mfa":"push","user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0.0.0"}}'
        repeat: 30
        every: 15
      - source: app
        raw: '{{"timestamp":"{ts}","level":"warn","service":"portal-auth","event":"login","request_id":"t{n}","user":"staff{n}","ip":"78.160.200.1","result":"failure","reason":"invalid_password","mfa":"push","user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0.0.0"}}'
        repeat: 3
        every: 15
        at: 5
  - name: rotating clients across attempts belong to credential stuffing
    expect: no_alert
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"warn","service":"portal-auth","event":"login","request_id":"r{n}","user":"user{n}","ip":"95.24.1.10","result":"failure","reason":"invalid_password","mfa":"push","user_agent":"Mozilla/5.0 client-{n}"}}'
        repeat: 12
        every: 20
