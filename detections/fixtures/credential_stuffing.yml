rule: credential_stuffing
cases:
  - name: forty addresses replay leaked credentials for forty accounts
    expect: alert
    count: 1
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"warn","service":"portal-auth","event":"login","request_id":"c{n}","user":"leak{n}@mail.com","ip":"95.24.{n}.10","result":"failure","reason":"unknown_user","mfa":"none","user_agent":"Mozilla/5.0 client-{n}"}}'
        repeat: 40
        every: 10
  - name: busy morning where many users log in successfully
    expect: no_alert
    lines:
      - source: app
        raw: '{{"timestamp":"{ts}","level":"info","service":"portal-auth","event":"login","request_id":"m{n}","user":"user{n}","ip":"78.160.{n}.1","result":"success","reason":null,"mfa":"push","user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0.0.0"}}'
        repeat: 60
        every: 10
