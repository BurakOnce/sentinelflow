name: e2e

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Seconds to wait for the alert
        default: "300"

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_FROZEN: "1"
      PROFILES: core streaming
      E2E_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra simulator
      - run: cp .env.example .env
      - name: Start the streaming stack
        run: make up PROFILES="core streaming"
      - name: Run the end to end test
        run: uv run pytest -m integration -v
      - name: Collect logs
        if: failure()
        run: docker compose --profile core --profile streaming logs --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose --profile core --profile streaming down -v
